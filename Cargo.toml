[workspace]
resolver = "2"
members = [
    "crates/nucleus-db",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/harshverma27/nucleus"
authors = ["Harsh Verma"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
