name: Bug report
description: Report a problem with the nucleus CLI, LSP, trace, or VS Code extension.
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The stm32.toml (or relevant snippet) and the exact command you ran.
      render: toml
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs. actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: nucleus --version output
    validations:
      required: true
  - type: dropdown
    id: board
    attributes:
      label: Board / family
      options:
        - NUCLEO-F446RE (STM32F446RE)
        - NUCLEO-F411RE (STM32F411RE)
        - Other / not hardware-specific
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - macOS
        - Windows
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      render: shell
