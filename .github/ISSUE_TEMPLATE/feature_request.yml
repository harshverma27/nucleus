name: Feature request
description: Suggest an idea for Nucleus.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: component
    attributes:
      label: Which component does this touch?
      multiple: true
      options:
        - nucleus-cli
        - nucleus-compiler
        - nucleus-db
        - nucleus-lsp
        - nucleus-itm
        - nucleus-trace
        - VS Code extension
        - Documentation
    validations:
      required: true
