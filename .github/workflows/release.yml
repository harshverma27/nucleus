name: Release

# Phase 7 — Distribution + Release Automation.
#
# Fires on a semver tag (e.g. `v0.1.0`) and:
#   1. builds cross-platform `nucleus` binaries (Linux/macOS/Windows, x86_64 +
#      arm64), packaged with SHA-256 checksums;
#   2. packages the VS Code extension into a `.vsix`;
#   3. publishes a GitHub Release with auto-generated notes and all artifacts;
#   4. publishes the crates to crates.io and the extension to the Marketplace,
#      when the corresponding tokens are configured as repository secrets.
#
# Secrets used (publishing steps no-op without them, so forks/dry runs are safe):
#   CARGO_REGISTRY_TOKEN  — crates.io publish
#   VSCE_PAT              — VS Code Marketplace publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build-binaries:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,  cross: false }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu, cross: true }
          - { os: macos-latest,   target: x86_64-apple-darwin,       cross: false }
          - { os: macos-latest,   target: aarch64-apple-darwin,      cross: false }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,    cross: false }
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install aarch64 Linux cross linker
        if: ${{ matrix.cross }}
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build nucleus
        run: cargo build -p nucleus-cli --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: ${{ matrix.os != 'windows-latest' }}
        shell: bash
        run: |
          name="nucleus-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/nucleus" "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          ( cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )

      - name: Package (Windows)
        if: ${{ matrix.os == 'windows-latest' }}
        shell: bash
        run: |
          name="nucleus-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/nucleus.exe" "dist/$name/"
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"
          ( cd dist && 7z a "$name.zip" "$name" >/dev/null )
          ( cd dist && certutil -hashfile "$name.zip" SHA256 > "$name.zip.sha256" )

      - name: Upload artifacts
        uses: actions/upload-artifact@v5
        with:
          name: binaries-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
            dist/*.zip
            dist/*.zip.sha256

  build-vsix:
    name: package extension (.vsix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Build and package
        working-directory: extension
        run: |
          npm ci
          npm run build
          npx --yes @vscode/vsce package -o "../nucleus-${GITHUB_REF_NAME}.vsix"
      - name: Upload .vsix artifact
        uses: actions/upload-artifact@v5
        with:
          name: vsix
          path: "*.vsix"

      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        working-directory: extension
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce publish

  release:
    name: publish GitHub Release
    needs: [build-binaries, build-vsix]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: false

  publish-crates:
    name: publish to crates.io
    needs: build-binaries
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable

      - name: Publish crates in dependency order
        if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
        run: |
          set -euo pipefail
          for crate in nucleus-db nucleus-itm nucleus-compiler nucleus-lsp nucleus-trace nucleus-cli; do
            echo "::group::publish $crate"
            cargo publish -p "$crate"
            echo "::endgroup::"
            # Give the index time to update before dependents resolve.
            sleep 25
          done
