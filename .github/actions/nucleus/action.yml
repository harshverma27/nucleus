name: "Nucleus check"
description: "Validate stm32.toml with the Nucleus constraint solver, optionally build firmware, run HIL tests on both backends, and post a PR summary with per-backend results."
branding:
  icon: "cpu"
  color: "blue"

inputs:
  config:
    description: "Path to the stm32.toml to validate."
    required: false
    default: "stm32.toml"
  build:
    description: "Also run `nucleus build` (requires the ARM toolchain in the runner)."
    required: false
    default: "false"
  run_tests:
    description: "Run `nucleus test` after building (QEMU always; hardware when the hardware leg is enabled). Requires `build: true`."
    required: false
    default: "true"
  hardware:
    description: "Also run the hardware test leg (needs a self-hosted runner with a connected board + OpenOCD). Off by default; the report records it as skipped."
    required: false
    default: "false"
  version:
    description: "nucleus-cli version to install from crates.io, or 'git' to build from this repo's main."
    required: false
    default: "*"
  comment:
    description: "Post the summary as a PR comment (needs `pull-requests: write`)."
    required: false
    default: "true"

outputs:
  conflicts:
    description: "Number of conflicts reported by `nucleus check`."
    value: ${{ steps.check.outputs.conflicts }}
  firmware-size:
    description: "Size of the built firmware.bin in bytes (empty if not built)."
    value: ${{ steps.build.outputs.size }}
  qemu-passed:
    description: "Assertions passed on the QEMU backend (empty if tests didn't run)."
    value: ${{ steps.test_qemu.outputs.passed }}
  hardware-passed:
    description: "Assertions passed on the hardware backend (empty if the leg was skipped)."
    value: ${{ steps.test_hw.outputs.passed }}

runs:
  using: "composite"
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install nucleus
      shell: bash
      run: |
        set -euo pipefail
        if [ "${{ inputs.version }}" = "git" ]; then
          cargo install --git https://github.com/harshverma27/nucleus nucleus-cli --locked
        else
          ver="${{ inputs.version }}"
          if [ "$ver" = "*" ]; then
            cargo install nucleus-cli --locked
          else
            cargo install nucleus-cli --locked --version "$ver"
          fi
        fi

    - name: nucleus check
      id: check
      shell: bash
      run: |
        set +e
        out="$(nucleus check "${{ inputs.config }}" 2>&1)"
        code=$?
        echo "$out"
        conflicts=$(printf '%s\n' "$out" | grep -c 'error:' || true)
        echo "conflicts=$conflicts" >> "$GITHUB_OUTPUT"
        echo "$out" > "$RUNNER_TEMP/nucleus-check.txt"
        exit $code

    - name: nucleus build
      id: build
      if: ${{ inputs.build == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        nucleus build
        bin="build/firmware.bin"
        if [ -f "$bin" ]; then
          size=$(wc -c < "$bin" | tr -d ' ')
          echo "size=$size" >> "$GITHUB_OUTPUT"
        fi

    # QEMU is always available on GitHub-hosted Linux runners (via apt). The
    # emulator leg therefore runs on every CI, with no special hardware.
    - name: Install QEMU (emulator backend)
      if: ${{ inputs.build == 'true' && inputs.run_tests == 'true' && runner.os == 'Linux' }}
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v qemu-system-arm >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm
        fi

    - name: nucleus test (QEMU)
      id: test_qemu
      if: ${{ inputs.build == 'true' && inputs.run_tests == 'true' }}
      shell: bash
      run: |
        set +e
        out="$(nucleus test --backend qemu 2>&1)"
        code=$?
        echo "$out"
        passed=$(printf '%s\n' "$out" | grep -c 'PASS' || true)
        failed=$(printf '%s\n' "$out" | grep -c 'FAIL' || true)
        skipped=$(printf '%s\n' "$out" | grep -c 'SKIP' || true)
        {
          echo "passed=$passed"
          echo "failed=$failed"
          echo "skipped=$skipped"
        } >> "$GITHUB_OUTPUT"
        exit $code

    # The hardware leg only runs when explicitly enabled (self-hosted runner +
    # board). When off it is reported as "skipped", never as a failure — the
    # action degrades gracefully so it stays green on hosted runners.
    - name: nucleus test (hardware)
      id: test_hw
      if: ${{ inputs.build == 'true' && inputs.run_tests == 'true' && inputs.hardware == 'true' }}
      shell: bash
      run: |
        set +e
        out="$(nucleus test --backend hardware 2>&1)"
        code=$?
        echo "$out"
        passed=$(printf '%s\n' "$out" | grep -c 'PASS' || true)
        failed=$(printf '%s\n' "$out" | grep -c 'FAIL' || true)
        skipped=$(printf '%s\n' "$out" | grep -c 'SKIP' || true)
        {
          echo "passed=$passed"
          echo "failed=$failed"
          echo "skipped=$skipped"
        } >> "$GITHUB_OUTPUT"
        exit $code

    # `nucleus test` appends this run to tests/test_history.json; publish it so
    # the run's results travel with the build and the dashboard can read them.
    - name: Upload test history
      if: ${{ always() && inputs.build == 'true' && inputs.run_tests == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: nucleus-test-history
        path: tests/test_history.json
        if-no-files-found: ignore

    - name: Build summary
      if: ${{ always() }}
      shell: bash
      run: |
        check_out="$(cat "$RUNNER_TEMP/nucleus-check.txt" 2>/dev/null || echo '(no output)')"
        conflicts="${{ steps.check.outputs.conflicts }}"
        size="${{ steps.build.outputs.size }}"
        {
          echo "## 🧩 Nucleus"
          echo
          echo "Config: \`${{ inputs.config }}\`"
          echo
          if [ "${{ steps.check.outcome }}" = "success" ]; then
            echo "- ✅ **Valid** — no conflicts."
          else
            echo "- ❌ **${conflicts:-?} conflict(s)** detected."
          fi
          [ -n "$size" ] && echo "- 📦 Firmware size: **$size bytes**"

          # Per-backend test results, with graceful degradation.
          if [ "${{ inputs.build }}" = "true" ] && [ "${{ inputs.run_tests }}" = "true" ]; then
            echo "- 🧪 **Tests:**"
            qp="${{ steps.test_qemu.outputs.passed }}"
            qf="${{ steps.test_qemu.outputs.failed }}"
            if [ -n "$qp" ]; then
              echo "    - QEMU: **${qp} passed**, ${qf:-0} failed"
            else
              echo "    - QEMU: emulator leg skipped"
            fi
            if [ "${{ inputs.hardware }}" = "true" ]; then
              hp="${{ steps.test_hw.outputs.passed }}"
              hf="${{ steps.test_hw.outputs.failed }}"
              echo "    - Hardware: **${hp:-0} passed**, ${hf:-0} failed"
            else
              echo "    - Hardware: leg skipped (no self-hosted board)"
            fi
            echo "    - Full results: \`nucleus-test-history\` artifact (tests/test_history.json)."
          fi

          echo
          echo '```'
          echo "$check_out"
          echo '```'
        } | tee "$RUNNER_TEMP/nucleus-summary.md" >> "$GITHUB_STEP_SUMMARY"

    - name: Comment on PR
      if: ${{ always() && inputs.comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v8
      with:
        script: |
          const fs = require('fs');
          const body = fs.readFileSync(process.env.RUNNER_TEMP + '/nucleus-summary.md', 'utf8');
          const marker = '<!-- nucleus-action -->';
          const full = marker + '\n' + body;
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const { data: comments } = await github.rest.issues.listComments({ owner, repo, issue_number });
          const existing = comments.find((c) => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: full });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body: full });
          }
