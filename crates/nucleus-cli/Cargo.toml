[package]
name = "nucleus-cli"
description = "Nucleus CLI: the STM32 developer platform binary (nucleus check/build/flash/trace/lsp)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["stm32", "embedded", "cli", "nucleo", "hal"]
categories = ["embedded", "command-line-utilities", "development-tools"]

[[bin]]
name = "nucleus"
path = "src/main.rs"

[dependencies]
nucleus-compiler = { path = "../nucleus-compiler", version = "0.1.0" }
nucleus-db = { path = "../nucleus-db", version = "0.1.0" }
nucleus-hil = { path = "../nucleus-hil", version = "0.1.0" }
nucleus-lsp = { path = "../nucleus-lsp", version = "0.1.0" }
nucleus-trace = { path = "../nucleus-trace", version = "0.1.0" }
nucleus-ledger = { path = "../nucleus-ledger", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }

[lints]
workspace = true
