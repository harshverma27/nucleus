[package]
name = "nucleus-cli"
description = "Nucleus CLI: the STM32 developer platform binary (nucleus check/build/flash/trace/lsp)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "nucleus"
path = "src/main.rs"

[dependencies]
nucleus-compiler = { path = "../nucleus-compiler" }
nucleus-db = { path = "../nucleus-db" }
clap = { version = "4", features = ["derive"] }

[lints]
workspace = true
