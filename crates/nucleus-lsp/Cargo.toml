[package]
name = "nucleus-lsp"
description = "Nucleus language server: live stm32.toml diagnostics, hover, and pin-name completion over LSP"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["stm32", "lsp", "embedded", "editor", "itm"]
categories = ["development-tools", "embedded"]

[dependencies]
nucleus-compiler = { path = "../nucleus-compiler", version = "0.2.0" }
nucleus-db = { path = "../nucleus-db", version = "0.2.0" }
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "io-std", "macros", "sync"] }

[lints]
workspace = true
