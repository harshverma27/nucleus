[package]
name = "nucleus-compiler"
description = "Nucleus pinmux compiler: stm32.toml parsing, hardware constraint solving, and HAL codegen"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["stm32", "embedded", "codegen", "hal", "toml"]
categories = ["embedded", "development-tools::build-utils", "parser-implementations"]

[dependencies]
nucleus-db = { path = "../nucleus-db", version = "0.2.0" }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
toml_edit = "0.22"

[lints]
workspace = true
