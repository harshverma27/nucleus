[package]
name = "nucleus-trace"
description = "Nucleus trace backend: ITM decode pipeline, OpenOCD/SWO ingest, and WebSocket streaming"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
readme = "README.md"
keywords = ["stm32", "itm", "swo", "trace", "websocket"]
categories = ["embedded", "network-programming", "visualization"]

[dependencies]
nucleus-itm = { path = "../nucleus-itm", version = "0.0.1" }
nucleus-compiler = { path = "../nucleus-compiler", version = "0.0.1" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time", "fs"] }
tokio-tungstenite = "0.21"
futures-util = "0.3"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "sync", "macros", "time"] }

[lints]
workspace = true
